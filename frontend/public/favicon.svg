<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#1B4332"/>

  <!-- Main stem -->
  <line x1="16" y1="27" x2="16" y2="6" stroke="#E8A217" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Peduncles -->
  <line x1="16" y1="14" x2="12" y2="12.5" stroke="#E8A217" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="16" y1="14" x2="20" y2="12.5" stroke="#E8A217" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="16" y1="20" x2="12" y2="18.5" stroke="#E8A217" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="16" y1="20" x2="20" y2="18.5" stroke="#E8A217" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Top grain -->
  <ellipse cx="16" cy="8.5" rx="2.8" ry="4.2" fill="#E8A217"/>

  <!-- Left upper grain -->
  <ellipse cx="10.5" cy="12" rx="2.4" ry="3.8" fill="#E8A217" transform="rotate(-28 10.5 12)"/>

  <!-- Right upper grain -->
  <ellipse cx="21.5" cy="12" rx="2.4" ry="3.8" fill="#E8A217" transform="rotate(28 21.5 12)"/>

  <!-- Left lower grain -->
  <ellipse cx="10.5" cy="18.5" rx="2.4" ry="3.8" fill="#E8A217" transform="rotate(-28 10.5 18.5)"/>

  <!-- Right lower grain -->
  <ellipse cx="21.5" cy="18.5" rx="2.4" ry="3.8" fill="#E8A217" transform="rotate(28 21.5 18.5)"/>
</svg>
