# LOT PROD-1 (audit XXX RIZ) : bloquant confirmé — sans ce fichier, Netlify
# sert du 404 statique sur toute route client (ex. /vendor, /product/riz-x)
# rechargée directement ou partagée en lien, faute de règle de repli vers
# index.html (le routage réel est fait par React Router côté client).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
